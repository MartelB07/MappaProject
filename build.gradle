plugins {
    id 'application'
}

group = 'mappa'
version = '0.2.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile for Java 21 with whatever JDK (21+) runs Gradle.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'mappa.GameLauncher'
}

// `gradlew run` needs the console attached for interactive play.
tasks.named('run') {
    standardInput = System.in
}

jar {
    manifest { attributes 'Main-Class': 'mappa.GameLauncher' }
    // Fat jar so `java -jar` works without a classpath.
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform {
        if (project.hasProperty('includeTags')) {
            includeTags project.property('includeTags')
        }
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
